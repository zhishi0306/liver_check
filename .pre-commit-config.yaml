repos:
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: npx --no-install biome check --write
        language: system
        pass_filenames: true
        files: \.(ts|tsx|js|jsx|json|jsonc)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=4096]
